[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn-mlflow"
version = "0.1.0"
description = "Experimentos reproducibles de churn con MLflow (proyecto de MLOps)"
requires-python = ">=3.10,<3.13"

[tool.setuptools.packages.find]
include = ["churn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
